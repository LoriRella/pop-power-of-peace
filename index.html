<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POP · Power of Peace</title>
<meta name="description" content="Small acts of peace, at your own pace. Watch your country and the world light up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.hero-l{flex:1 1 540px;min-width:0;max-width:600px;padding-top:36px}
.hero-eyebrow{position:relative;display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#5b3fd6}
.bfly-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #b9a6f5;background:#ffffff;color:#5b3fd6;font:inherit;font-size:13px;font-weight:700;letter-spacing:0;cursor:help;padding:0}
.bfly-tip{position:absolute;left:0;top:calc(100% + 10px);z-index:20;width:300px;padding:14px 16px;border-radius:14px;background:#1d1b3c;color:#eceafb;font-size:14px;font-weight:400;line-height:1.5;letter-spacing:0;text-transform:none;box-shadow:0 18px 40px -18px rgba(29,27,60,.6);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s}
.hero-eyebrow:hover .bfly-tip,.hero-eyebrow:focus-within .bfly-tip{opacity:1;transform:none}
.hero-h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(44px,5vw,76px);line-height:1;letter-spacing:-.03em;color:#1d1b3c}
.hero-iri{display:block;background:linear-gradient(90deg,#c95fae,#7b5be0 35%,#3f8fd6 65%,#2fae8a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero-sub{margin:26px 0 0;max-width:440px;font-size:20px;line-height:1.5;color:#3d3a63}
.hero-stat{margin:30px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-num{font-family:Fraunces,Georgia,serif;font-size:clamp(34px,3.4vw,46px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#1d1b3c}
#top{position:relative;border-radius:40px;background:radial-gradient(ellipse 55% 60% at 12% 30%,rgba(240,166,216,.45),transparent 70%),radial-gradient(ellipse 50% 55% at 88% 40%,rgba(143,200,245,.45),transparent 70%),radial-gradient(ellipse 45% 50% at 55% 95%,rgba(158,232,207,.40),transparent 70%),radial-gradient(ellipse 40% 40% at 45% 10%,rgba(185,166,245,.40),transparent 70%)}
@keyframes iriShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero-iri{background:linear-gradient(90deg,#d94fa8,#8a4fe8,#3f86e0,#22b38c,#d9a020,#d94fa8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:iriShift 9s ease-in-out infinite}
.hero-num{background:linear-gradient(90deg,#1d1b3c,#6b3fd6,#2f7fd0,#1d1b3c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:iriShift 12s ease-in-out infinite}
#top .btn-iri{background:linear-gradient(90deg,#f28bcf,#a98bff,#6fb8ff,#6fe0bd,#ffe07a,#f28bcf) !important;background-size:250% 100% !important;animation:iriShift 6s ease-in-out infinite;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 16px 40px -10px rgba(155,110,255,.75),0 0 30px -6px rgba(240,140,210,.6) !important}
.heroglobe{filter:drop-shadow(0 0 40px rgba(185,140,255,.55)) drop-shadow(0 0 90px rgba(120,190,255,.35))}
@media (prefers-reduced-motion: reduce){.hero-iri,.hero-num,#top .btn-iri{animation:none}}
#top::before{content:"";position:absolute;inset:0;border-radius:40px;pointer-events:none;z-index:0;background:radial-gradient(ellipse 35% 45% at 30% -5%,rgba(255,244,214,.75),rgba(255,236,250,.25) 45%,transparent 70%),conic-gradient(from 200deg at 30% -10%,transparent 0deg,rgba(255,250,235,.35) 8deg,transparent 18deg,rgba(255,240,250,.28) 30deg,transparent 42deg,rgba(255,250,235,.3) 55deg,transparent 68deg);filter:blur(6px);animation:godlight 10s ease-in-out infinite}
@keyframes godlight{0%,100%{opacity:.75}50%{opacity:1}}
#top::after{content:"";position:absolute;inset:0;border-radius:40px;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1.5px,transparent 2.5px),radial-gradient(circle,rgba(255,226,250,.9) 0 1px,transparent 2px),radial-gradient(circle,rgba(214,236,255,.95) 0 1.2px,transparent 2.2px);background-size:180px 160px,240px 210px,130px 150px;background-position:20px 30px,90px 70px,50px 110px;animation:twinkle 4.5s ease-in-out infinite alternate,drift 40s linear infinite}
@keyframes twinkle{0%{opacity:.25}50%{opacity:.9}100%{opacity:.45}}
@keyframes drift{from{background-position:20px 30px,90px 70px,50px 110px}to{background-position:200px -130px,330px -140px,180px -40px}}
#top>*{position:relative;z-index:1}
.hero-h1{text-shadow:0 0 30px rgba(255,255,255,.7)}
.hero-iri{filter:drop-shadow(0 0 18px rgba(200,150,255,.45))}
@media (prefers-reduced-motion: reduce){#top::before,#top::after{animation:none}}
.bfly-story{position:relative;margin:26px 0 0;max-width:520px;padding:20px 24px 20px 70px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.42));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 20px 50px -24px rgba(110,70,200,.45),0 0 0 1px rgba(255,255,255,.7) inset}
.bfly-story::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1.5px;background:linear-gradient(120deg,#f0a6d8,#b9a6f5,#8fc8f5,#9ee8cf,#f3e9a0,#f0a6d8);background-size:300% 100%;animation:iriShift 8s ease-in-out infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.bfly-ico{position:absolute;left:22px;top:20px;animation:flutter 3.2s ease-in-out infinite;transform-origin:50% 60%}
@keyframes flutter{0%,100%{transform:scaleX(1) rotate(-4deg)}50%{transform:scaleX(.72) rotate(4deg)}}
.bfly-story blockquote{margin:0;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:18px;line-height:1.5;color:#2b2856}
.bfly-story blockquote strong{font-style:normal;font-weight:600;color:#5b3fd6}
.bfly-story figcaption{margin-top:10px;font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.4;font-weight:600;background:linear-gradient(90deg,#c0479b,#7b4fe0,#3f86e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bfly-story figcaption em{font-style:italic}
@media (prefers-reduced-motion: reduce){.bfly-ico,.bfly-story::before{animation:none}}
.bfly-story{border-radius:36px !important;padding:24px 56px 24px 72px !important}
.bfly-story::before{border-radius:36px !important}
.bfly-more{position:absolute;right:18px;top:18px}
.bfly-info{width:28px;height:28px;border-radius:50%;border:1.5px solid #b9a6f5;background:rgba(255,255,255,.9);color:#5b3fd6;font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:15px;cursor:help;padding:0;line-height:1}
.bfly-sci{position:absolute;right:0;top:38px;z-index:30;width:280px;padding:14px 18px;border-radius:24px;background:#1d1b3c;color:#eceafb;font-size:14px;line-height:1.5;box-shadow:0 18px 40px -18px rgba(29,27,60,.6);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .2s}
.bfly-more:hover .bfly-sci,.bfly-more:focus-within .bfly-sci{opacity:1;transform:none}
#top{border-radius:56px !important}#top::before,#top::after{border-radius:56px !important}
.hero-eyebrow{margin:0 0 10px !important}
.hero-story{margin:0 0 26px;max-width:520px;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(18px,1.6vw,22px);line-height:1.45;color:#3b2f6e}
.hero-story-em{font-weight:600;background:linear-gradient(90deg,#d94fa8,#8a4fe8,#3f86e0,#22b38c,#d9a020,#d94fa8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:iriShift 7s ease-in-out infinite}
.hero-hl{position:relative;display:inline-block;padding:0 .18em;margin-left:-.18em;border-radius:.4em;background:linear-gradient(100deg,rgba(255,182,224,.75),rgba(240,170,230,.45) 60%,rgba(214,190,255,.35));box-shadow:0 0 40px 6px rgba(255,170,220,.35)}
.hero-numlab{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#5d5a80}
</style>
</head>
<body>

<!-- The whole app. script.js fills in the {{ values }} and shows it. -->
<div id="app" hidden>
<div style="font-family: Inter, system-ui, sans-serif; color: #1d1b3c; background: linear-gradient(115deg, #eceafb 0%, #e8f1f8 45%, #e6f5f0 70%, #f8f1e6 100%); min-height: 100vh">


<!-- NAV -->
<div style="position: sticky; top: 0; z-index: 40; padding: 14px 20px 6px">
<header class="{{ headerClass }}" style="max-width: 1240px; margin: 0 auto; padding: 8px 10px 8px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<a href="#top" data-on-click="goHome" class="logo" aria-label="POP, Power of Peace. Home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1d1b3c">
<span aria-hidden="true" style="display: flex; align-items: center; font-family: Fraunces, Georgia, serif; font-size: 31px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; color: #1d1b3c">P<svg width="28" height="28" viewBox="0 0 28 28" style="margin: 0 1px; transform-origin: 14px 14px"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a6d8"></stop><stop offset=".4" stop-color="#b9a6f5"></stop><stop offset=".7" stop-color="#8fc8f5"></stop><stop offset="1" stop-color="#9ee8cf"></stop></linearGradient></defs><circle cx="14" cy="14" r="11.5" fill="none" stroke="url(#lg)" stroke-width="3"></circle><circle cx="14" cy="14" r="6" fill="none" stroke="#8fc8f5" stroke-width="2.4"></circle><circle cx="14" cy="14" r="2.4" fill="#9ee8cf"></circle></svg>P</span>
<span class="logosub" aria-hidden="true" style="padding-left: 12px; border-left: 1.5px solid rgba(29, 27, 60, 0.15); font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5b3fd6; white-space: nowrap">Power of Peace</span>
</a>
<span class="navstat" aria-hidden="true" style="align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #1d1b3c; background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(29, 27, 60, 0.08); font-variant-numeric: tabular-nums"><span class="live" style="width: 7px; height: 7px; border-radius: 50%; background: #3fbf94"></span>{{ totalStr }} acts</span>
<template data-if="loggedOut">
<button type="button" class="menubtn" data-on-click="toggleMenu" aria-expanded="{{ menuExpanded }}" aria-controls="mainnav" aria-label="Menu" style="display: none; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #1d1b3c; background: transparent; color: #1d1b3c; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</template>
<nav id="mainnav" aria-label="Main" class="{{ navClass }}" style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 15px; font-weight: 500">
<template data-if="loggedOut">
<a href="#world" data-on-click="closeMenu" class="{{ nl_world }}" aria-current="{{ ac_world }}" style="text-decoration: none">The world today</a>
<a href="#missions" data-on-click="closeMenu" class="{{ nl_missions }}" aria-current="{{ ac_missions }}" style="text-decoration: none">Missions</a>
<button type="button" data-on-click="goLogin" class="btn-ghost" style="margin-left: 8px; font: inherit; font-size: 15px; font-weight: 600; color: #1d1b3c; background: transparent; border: 2px solid #1d1b3c; border-radius: 999px; padding: 10px 20px; cursor: pointer">Log in</button>
<a href="#join" data-on-click="closeMenu" class="joinbtn" style="text-decoration: none; color: #ffffff; padding: 12px 22px; border-radius: 999px; font-weight: 600">Join the ripple</a>
</template>
<template data-if="loggedIn">
<button type="button" data-on-click="goHome" class="{{ nl_home }}" aria-current="{{ ac_home }}" style="font: inherit; font-size: 15px; font-weight: 500; color: #1d1b3c; border: 0; cursor: pointer">Home</button>
<button type="button" data-on-click="goWorld" class="{{ nl_world }}" aria-current="{{ ac_world }}" style="font: inherit; font-size: 15px; font-weight: 500; color: #1d1b3c; border: 0; cursor: pointer">The world</button>
<button type="button" data-on-click="goMissions" class="{{ nl_missions }}" aria-current="{{ ac_missions }}" style="font: inherit; font-size: 15px; font-weight: 500; color: #1d1b3c; border: 0; cursor: pointer">My missions</button>
<button type="button" data-on-click="goStories" class="{{ nl_stories }}" aria-current="{{ ac_stories }}" style="font: inherit; font-size: 15px; font-weight: 500; color: #1d1b3c; border: 0; cursor: pointer">Stories</button>
<button type="button" data-on-click="openProfile" aria-label="Your profile" class="profilebtn" style="margin-left: 8px; font: inherit; display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 4px; border-radius: 999px; border: 2px solid rgba(29, 27, 60, 0.15); background: rgba(255, 255, 255, 0.7); color: #1d1b3c; cursor: pointer">
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #1d1b3c; background: linear-gradient(135deg, #f0a6d8, #b9a6f5 30%, #8fc8f5 55%, #9ee8cf 78%, #f3e9a0)">{{ initial }}</span>
<span style="font-size: 15px; font-weight: 600">{{ userName }}</span>
</button>
</template>
</nav>
</header>
</div>


<!-- ONBOARDING -->
<template data-if="onboarding">
<section aria-label="Sign up" style="max-width: 680px; margin: 0 auto; padding: 16px 24px 120px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<button type="button" data-on-click="obBack" style="font: inherit; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px; font-size: 15px; font-weight: 600; color: #1d1b3c; background: transparent; border: 0; border-radius: 999px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>{{ backLabel }}</button>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #3d3a63">Step {{ step }} of 4</p>
</div>
<div aria-hidden="true" style="margin-top: 14px; display: flex; gap: 8px">
<template data-for="sb in stepBars"><span style="{{ sb.style }}"></span></template>
</div>

<template data-if="step2">
<div style="margin-top: 40px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(36px, 5vw, 52px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em">How many missions this week?</h1>
<p style="margin: 12px 0 0; font-size: 18px; line-height: 1.6; color: #3d3a63">Go at your own pace, {{ userName }}. You can change it anytime, and nothing resets if you miss a week.</p>
<div role="group" aria-label="Missions per week" style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px">
<template data-for="pc in paces">
<button type="button" data-on-click="pc.pick" aria-pressed="{{ pc.pressed }}" style="{{ pc.style }}">
<span style="font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1">{{ pc.n }}</span>
<span style="font-size: 15px; font-weight: 600">{{ pc.label }}</span>
</button>
</template>
</div>
<button type="button" data-on-click="obNext" class="btn-dark" style="font: inherit; font-size: 17px; font-weight: 600; color: #ffffff; background: #1d1b3c; border: 0; border-radius: 999px; padding: 17px 30px; cursor: pointer; margin-top: 36px; width: 100%">Continue with {{ pace }} a week</button>
</div>
</template>

<template data-if="step3">
<div style="margin-top: 40px; text-align: center">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(36px, 5vw, 52px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em">Your first mission</h1>
<p style="margin: 12px auto 0; max-width: 480px; font-size: 18px; line-height: 1.6; color: #3d3a63">{{ obHint }}</p>
<div style="margin-top: 36px; display: flex; justify-content: center; perspective: 1400px">
<button type="button" data-on-click="obFlip" aria-label="{{ first.aria }}" aria-pressed="{{ first.pressed }}" style="font: inherit; padding: 0; border: 0; background: transparent; cursor: pointer; width: min(340px, 100%); height: 440px">
<span style="{{ first.innerStyle }}">
<span style="{{ first.backStyle }}">
<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring" cx="60" cy="60" r="34" fill="none" stroke="#1d1b3c" stroke-width="2"></circle><circle class="ring ring2" cx="60" cy="60" r="34" fill="none" stroke="#1d1b3c" stroke-width="2"></circle><circle cx="60" cy="60" r="16" fill="#1d1b3c"></circle></svg>
<span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; color: #1d1b3c">Mission #1</span>
<span style="font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #1d1b3c">Tap to open</span>
</span>
<span style="{{ first.frontStyle }}">
<span style="display: flex; flex-wrap: wrap; gap: 6px"><template data-for="t in first.tags"><span style="{{ t.style }}">{{ t.name }}</span></template></span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.15; color: #1d1b3c">{{ first.title }}</span>
<span style="font-size: 17px; line-height: 1.6; color: #3d3a63">{{ first.desc }}</span>
</span>
</span>
</button>
</div>
<div style="margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center">
<button type="button" data-on-click="obDone" class="btn-dark" style="font: inherit; font-size: 17px; font-weight: 600; color: #ffffff; background: #1d1b3c; border: 0; border-radius: 999px; padding: 17px 30px; cursor: pointer">I did it</button>
<button type="button" data-on-click="obLater" class="btn-ghost" style="font: inherit; font-size: 17px; font-weight: 600; color: #1d1b3c; background: transparent; border: 2px solid #1d1b3c; border-radius: 999px; padding: 15px 28px; cursor: pointer">I’ll do it later</button>
</div>
</div>
</template>

<template data-if="step4">
<div style="margin-top: 32px; text-align: center">
<div style="position: relative; width: 220px; height: 220px; margin: 0 auto">
<svg viewBox="0 0 220 220" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a6d8"></stop><stop offset=".35" stop-color="#b9a6f5"></stop><stop offset=".6" stop-color="#8fc8f5"></stop><stop offset=".8" stop-color="#9ee8cf"></stop><stop offset="1" stop-color="#f3e9a0"></stop></linearGradient></defs>
<circle class="ring" cx="110" cy="110" r="64" fill="none" stroke="url(#cg)" stroke-width="3"></circle>
<circle class="ring ring2" cx="110" cy="110" r="64" fill="none" stroke="url(#cg)" stroke-width="3"></circle>
<circle class="ring ring3" cx="110" cy="110" r="64" fill="none" stroke="url(#cg)" stroke-width="3"></circle>
<circle cx="110" cy="110" r="52" fill="url(#cg)"></circle>
<path d="M88 111l15 15 30-32" fill="none" stroke="#1d1b3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h1 style="margin: 24px 0 0; font-family: Fraunces, Georgia, serif; font-size: clamp(34px, 5vw, 50px); font-weight: 600; line-height: 1.08; letter-spacing: -0.02em">Your first ripple just reached {{ home }} and the world.</h1>
<p style="margin: 14px auto 0; max-width: 480px; font-size: 18px; line-height: 1.6; color: #3d3a63">Welcome to POP, {{ userName }}. One small act might change someone’s day, and you may never know how far it travels.</p>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; text-align: left">
<div style="border-radius: 20px; padding: 22px 24px; background: #ffffff; box-shadow: 0 18px 40px -26px rgba(29, 27, 60, 0.4)">
<p style="margin: 0; font-size: 15px; color: #3d3a63">Acts in {{ home }}</p>
<p style="margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 600">{{ homeCountStr }}</p>
</div>
<div style="border-radius: 20px; padding: 22px 24px; background: #ffffff; box-shadow: 0 18px 40px -26px rgba(29, 27, 60, 0.4)">
<p style="margin: 0; font-size: 15px; color: #3d3a63">Acts around the world</p>
<p style="margin: 6px 0 0; font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 600">{{ totalStr }}</p>
</div>
</div>
<div style="margin-top: 28px">
<template data-if="showShareOb">
<div style="margin: 0 0 24px; border-radius: 22px; padding: 24px; text-align: left; background: linear-gradient(110deg, #f7e1f1 0%, #e3e0fb 30%, #d6ecfa 55%, #d8f5ea 80%, #fbf0cf 100%)">
<template data-if="shareOpen">

<!-- GUIDELINES -->
<template data-if="showGuide">
<section id="guidelines" aria-label="Community guidelines" style="max-width: 820px; margin: 0 auto; padding: 8px 24px 100px">
<button type="button" data-on-click="goHome" style="font: inherit; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px; font-size: 15px; font-weight: 600; color: #1d1b3c; background: transparent; border: 0; border-radius: 999px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</button>
<p style="margin: 20px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5b3fd6">Community guidelines</p>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(36px, 5vw, 54px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em">Keeping POP a peaceful place.</h1>
<p style="margin: 16px 0 0; font-size: 18px; line-height: 1.6; color: #3d3a63">Everything shared on POP should make someone’s day a little better. These six guidelines help keep it that way.</p>
<ol style="list-style: none; margin: 32px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #f0a6d8">1</span><span><span style="display: block; font-size: 18px; font-weight: 600">Be kind.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">Share stories that lift people up. No insults, mocking or hate of any kind.</span></span></li>
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #b9a6f5">2</span><span><span style="display: block; font-size: 18px; font-weight: 600">Protect privacy.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">Use your codename. Never share anyone’s full name, address, school or workplace.</span></span></li>
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #8fc8f5">3</span><span><span style="display: block; font-size: 18px; font-weight: 600">Ask before showing faces.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">Only share photos of people who said yes. Never share photos of children’s faces.</span></span></li>
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #9ee8cf">4</span><span><span style="display: block; font-size: 18px; font-weight: 600">Keep it real.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">Share things that actually happened. No ads, spam or links.</span></span></li>
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #f3e9a0">5</span><span><span style="display: block; font-size: 18px; font-weight: 600">Respect differences.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">Disagree with care. No attacks on anyone’s beliefs, culture or country.</span></span></li>
<li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: 18px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; color: #1d1b3c; background: #f6c3a8">6</span><span><span style="display: block; font-size: 18px; font-weight: 600">Stay safe.</span><span style="display: block; margin-top: 4px; font-size: 16px; line-height: 1.55; color: #3d3a63">No mission is worth risking your safety or anyone else’s. If it feels unsafe, skip it.</span></span></li>
</ol>
<div style="margin-top: 28px; border-radius: 22px; padding: 24px; background: #1f1c3b; color: #f4f2ff">
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #ffffff">How review works</p>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #dcd8f2">Every story and photo is checked by a person before it appears. If you report something, it’s hidden for you right away and our team looks at it.</p>
</div>
</section>

<!-- ABOUT -->
<template data-if="showAbout">
<section id="about" aria-label="About POP" style="max-width: 820px; margin: 0 auto; padding: 8px 24px 100px">
<button type="button" data-on-click="goHome" style="font: inherit; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 8px; font-size: 15px; font-weight: 600; color: #1d1b3c; background: transparent; border: 0; border-radius: 999px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</button>
<p style="margin: 20px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5b3fd6">About POP</p>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: clamp(36px, 5vw, 54px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em">Making the good in humanity visible.</h1>
<p style="margin: 16px 0 0; font-size: 18px; line-height: 1.6; color: #3d3a63">We hear so much about what’s wrong with the world that it’s easy to forget how much good happens every day. POP turns small acts of peace into something you can see, one ripple at a time.</p>
<h2 style="margin: 40px 0 16px; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600">Questions</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<details class="faq" style="border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><summary style="list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 22px; font-size: 17px; font-weight: 600; cursor: pointer">What is POP?<svg class="faqchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 0; padding: 0 22px 20px; font-size: 16px; line-height: 1.6; color: #3d3a63">POP (Power of Peace) is an app for small acts of peace. You choose how many missions you want each week, do them in your own way, and your acts light up your country and the world.</p></details>
<details class="faq" style="border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><summary style="list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 22px; font-size: 17px; font-weight: 600; cursor: pointer">Is it a competition between countries?<svg class="faqchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 0; padding: 0 22px 20px; font-size: 16px; line-height: 1.6; color: #3d3a63">No. Countries are never ranked. Every act adds to one shared total that belongs to everyone.</p></details>
<details class="faq" style="border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><summary style="list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 22px; font-size: 17px; font-weight: 600; cursor: pointer">Do I have to do a mission every day?<svg class="faqchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 0; padding: 0 22px 20px; font-size: 16px; line-height: 1.6; color: #3d3a63">No. You pick from one to seven missions a week, and you can change it anytime. Nothing resets if you miss a week.</p></details>
<details class="faq" style="border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><summary style="list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 22px; font-size: 17px; font-weight: 600; cursor: pointer">Who can see what I share?<svg class="faqchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 0; padding: 0 22px 20px; font-size: 16px; line-height: 1.6; color: #3d3a63">Only your codename and country are shown, never your name, email or city. Every story and photo is reviewed by a person before it appears.</p></details>
<details class="faq" style="border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px -26px rgba(29, 27, 60, 0.45)"><summary style="list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 22px; font-size: 17px; font-weight: 600; cursor: pointer">How do you protect my photos?<svg class="faqchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 0; padding: 0 22px 20px; font-size: 16px; line-height: 1.6; color: #3d3a63">Location details are removed from every photo. We ask that you only share people who agreed to it, and never children’s faces.</p></details>
</div>
<div id="privacy" style="margin-top: 28px; border-radius: 22px; padding: 24px; background: linear-gradient(110deg, #f7e1f1 0%, #e3e0fb 30%, #d6ecfa 60%, #d8f5ea 100%)">
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">Our privacy promise</p>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #3d3a63">Codenames, not real names. Countries, not cities. No location data in photos. We never sell your information.</p>
</div>
<button type="button" data-on-click="openGuidelines" class="btn-ghost" style="font: inherit; font-size: 16px; font-weight: 600; color: #1d1b3c; background: transparent; border: 2px solid #1d1b3c; border-radius: 999px; padding: 13px 22px; cursor: pointer; margin-top: 24px">Read the community guidelines</button>
</section>
</template>

<defs>
<radialGradient id="gl-ocean" cx="42%" cy="36%" r="70%"><stop offset="0" stop-color="#2d2860"></stop><stop offset=".65" stop-color="#1b1840"></stop><stop offset="1" stop-color="#120f2c"></stop></radialGradient>
<radialGradient id="gl-halo" cx="50%" cy="50%" r="50%"><stop offset=".78" stop-color="#b9a6f5" stop-opacity="0"></stop><stop offset=".86" stop-color="#b9a6f5" stop-opacity=".35"></stop><stop offset="1" stop-color="#8fc8f5" stop-opacity="0"></stop></radialGradient>
<linearGradient id="gl-rim" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8fc8f5"></stop><stop offset=".45" stop-color="#b9a6f5"></stop><stop offset="1" stop-color="#f0a6d8"></stop></linearGradient>
<linearGradient id="gl-land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c3e6"></stop><stop offset=".5" stop-color="#c9bbff"></stop><stop offset="1" stop-color="#a8ecdc"></stop></linearGradient>
<linearGradient id="gl-ring1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ee8cf" stop-opacity=".1"></stop><stop offset=".5" stop-color="#9ee8cf"></stop><stop offset="1" stop-color="#f3e9a0"></stop></linearGradient>
<linearGradient id="gl-ring2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0a6d8"></stop><stop offset=".6" stop-color="#b9a6f5"></stop><stop offset="1" stop-color="#b9a6f5" stop-opacity=".1"></stop></linearGradient>
<filter id="gl-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
<filter id="gl-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"></feGaussianBlur></filter>
</defs>

<template data-for="fx in flashes">
<circle cx="{{ fx.x }}" cy="{{ fx.y }}" r="{{ fx.r }}" fill="none" stroke="{{ fx.color }}" stroke-width="2" opacity="{{ fx.o }}"></circle>
<circle cx="{{ fx.x }}" cy="{{ fx.y }}" r="3.5" fill="#ffffff" opacity="{{ fx.o }}" filter="url(#gl-glow)"></circle>
</template>

<circle cx="300" cy="300" r="262" fill="none" stroke="url(#gl-rim)" stroke-width="16" opacity=".55" filter="url(#gl-soft)"></circle>
<circle cx="300" cy="300" r="251" fill="none" stroke="url(#gl-rim)" stroke-width="3.5" filter="url(#gl-glow)"></circle>
<circle cx="300" cy="300" r="243" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"></circle>

<g transform="rotate(-16 300 300)"><path d="M590 300 A290 70 0 0 1 10 300" fill="none" stroke="url(#gl-ring1)" stroke-width="2.6" stroke-dasharray="2 7" stroke-dashoffset="{{ dashA }}" filter="url(#gl-glow)"></path></g>
<g transform="rotate(11 300 300)"><path d="M572 300 A272 44 0 0 1 28 300" fill="none" stroke="url(#gl-ring2)" stroke-width="2" filter="url(#gl-glow)"></path></g>

<g fill="rgba(185, 166, 245, 0.07)" stroke="rgba(201, 187, 255, 0.45)" stroke-width="1.2">
<polygon points="96,150 112,141 128,150 128,168 112,177 96,168"></polygon>
<polygon points="128,168 144,159 160,168 160,186 144,195 128,186"></polygon>
<polygon points="458,402 474,393 490,402 490,420 474,429 458,420"></polygon>
<polygon points="490,384 506,375 522,384 522,402 506,411 490,402"></polygon>
<polygon points="70,388 82,381 94,388 94,402 82,409 70,402"></polygon>
</g>
</svg>

<template data-for="p in pins">
<button type="button" data-on-click="p.pick" aria-label="{{ p.aria }}" style="{{ p.style }}">
<span style="{{ p.ringStyle }}"></span>
<span style="{{ p.dotStyle }}"></span>
<span style="{{ p.labelStyle }}">{{ p.label }}</span>
</button>
</template>
</div>
</template>

<script src="script.js"></script>
</body>
</html>
